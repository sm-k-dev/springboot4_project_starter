// ============================================================
// build.gradle - 프로젝트의 "레시피" 파일
// 무엇을 할지(플러그인), 어떤 라이브러리를 쓸지(의존성),
// 테스트 코드는 src/test/java 에 둡니다(Gradle 기본 위치).
// Gradle은 이 파일을 읽고 빌드, 실행, 테스트를 수행합니다.
// ============================================================

plugins {
    // 자바 컴파일 기능을 켭니다.
    id 'java'
    // Spring Boot 플러그인: 실행 가능한 jar를 만들고 Spring Boot 버전에 맞는
    // 라이브러리 버전을 자동으로 정해 줍니다. (그래서 라이브러리마다 버전을 적지 않습니다)
    // 버전 4.0.9: Maven Central에 존재함을 확인함(2026-11-07). 새 패치가 나오면 Maven Central의 org.springframework.boot:spring-boot 목록에서 확인 후 이 값을 올리세요.
    id 'org.springframework.boot' version '4.0.9'
    // 의존성 관리 플러그인: 스타터의 버전 번호를 Spring Boot BOM에서 자동으로 맞춰 줍니다.
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // Java 25(Amazon Corretto 25)를 사용합니다. 내 PC에 다른 버전이 있어도 Gradle이 25를 찾아 씁니다.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // 라이브러리(jar)를 내려받을 공개 저장소입니다.
    mavenCentral()
}

dependencies {
    // 웹 API를 만들 때 쓰는 기본 묶음 (Spring Boot 4에서는 starter-web 대신 starter-webmvc 입니다)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // DB 접근 (JPA = 자바 객체를 테이블 행처럼 저장/조회하는 도구)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // @NotBlank 같은 입력값 검증 애노테이션
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // H2: 파일 설치 없이 메모리에서 도는 작은 DB. 실행할 때만 필요하므로 runtimeOnly
    runtimeOnly 'com.h2database:h2'

    // ----- 테스트에서만 쓰는 라이브러리 -----
    // JUnit 5, AssertJ, Mockito 등 기본 테스트 도구
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // MockMvc로 HTTP 요청을 흉내 내는 도구 (Spring Boot 4에서 별도 스타터로 분리됨)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // @DataJpaTest 같은 DB 테스트 애노테이션을 쓰기 위한 스타터
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // Gradle이 JUnit 실행기를 찾도록 돕는 라이브러리 (버전은 Spring Boot가 관리)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트 코드는 Gradle 기본 위치(src/test/java)에 둡니다. 별도 sourceSets 설정은 필요 없습니다.

tasks.withType(JavaCompile).configureEach {
    // 소스 파일을 UTF-8로 읽으라는 설정입니다. 한국어 주석과 문자열이 Windows(CP949)에서 깨지지 않게 합니다.
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    // JUnit 5(Jupiter)로 테스트를 실행하라는 설정입니다. 없으면 테스트가 실행되지 않을 수 있습니다.
    useJUnitPlatform()
}
